name: ci

# Offline checks only: no API keys, no live LLM or job-site calls.
# Backend tests run in the project's own Docker stack (Mongo, S3-compatible storage, MCP server), as they do locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example (no secrets)
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build backend mongo minio mcp
      - name: Wait for the backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 5
          done
          docker compose logs backend | tail -50
          exit 1
      - name: Run the offline test suite
        run: docker compose exec -T backend python -m pytest -q
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
