services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]  # for local debugging; the browser goes through the frontend
    environment:
      CHROMA_DIR: /data/chroma
      HF_HOME: /models
      MCP_SERVER_URL: http://mcp:8001/mcp
      MONGODB_URI: mongodb://mongo:27017
      S3_ENDPOINT_URL: http://minio:9000
    depends_on: [mongo, minio, mcp]
    volumes:
      - ./data:/srv/data
      - ./scripts:/srv/scripts
      - chroma_data:/data/chroma
      - model_cache:/models
  frontend:
    build:
      context: frontend
    ports: ["${FRONTEND_HOST_PORT:-8080}:80"]
    depends_on: [backend]
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file: .env
    depends_on: [minio]
    expose: ["8001"]
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  # MinIO's official images are no longer pullable; RustFS is an S3-compatible drop-in (same boto3 code).
  minio:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  chroma_data:
  mongo_data:
  minio_data:
  model_cache:
